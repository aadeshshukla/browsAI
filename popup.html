<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>VoiceBrowser</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <h1>VoiceBrowser</h1>

    <button id="micBtn" class="mic-btn">
      <span id="micIcon">🎤</span>
      <span id="micLabel">Hold to speak</span>
    </button>

    <div id="transcript" class="transcript" placeholder="Your command will appear here…"></div>
    <div id="status" class="status"></div>

    <details class="settings">
      <summary>Settings</summary>
      <label for="apiKey">Gemini API key</label>
      <input id="apiKey" type="password" placeholder="AIza…" />
      <label for="model">Model</label>
      <input id="model" type="text" placeholder="gemini-2.0-flash-lite" />
      <button id="saveBtn">Save</button>
      <div id="saveStatus" class="save-status"></div>
    </details>
  </div>
  <script src="popup.js"></script>
</body>
</html>
